[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainloops"
version = "0.1.0"
description = "Measure recurrent temporal structure in EEG-derived state trajectories"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "mne>=1.7"]

[project.scripts]
brainloops = "brainloops.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
