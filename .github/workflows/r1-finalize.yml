name: Verify and finalize R1 branch

on:
  push:
    branches:
      - feature/r1-resting-transition-recurrence

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r1-resting-transition-recurrence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Insert R1 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_before(path, marker, section_path):
              p = Path(path)
              section = Path(section_path).read_text(encoding='utf-8').rstrip()
              text = p.read_text(encoding='utf-8')
              heading = section.splitlines()[0]
              if heading in text:
                  return
              if marker not in text:
                  raise SystemExit(f'missing insertion marker {marker!r} in {path}')
              p.write_text(text.replace(marker, section + '\n\n' + marker, 1), encoding='utf-8')

          insert_before('README.md', '## Dataset ladder', '.r1/README_SECTION.md')
          insert_before('results/RESULTS.md', '## Dataset ladder', '.r1/RESULTS_SECTION.md')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          status = '- R1 resting transition recurrence: **implementation + synthetic calibration PASS**; real LEMON receipt pending; independent follow-up branch, not a rewrite of Gate 1B.'
          if status not in text:
              text = text.rstrip() + '\n' + status + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Generate and verify canonical synthetic R1 receipt
        run: |
          python experiments/r1_synthetic.py --n-null 99 --seed 1 --output results/receipts/r1-synthetic.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('results/receipts/r1-synthetic.json').read_text())
          assert p['status'] == 'PASS', p['status']
          assert p['config']['n_null'] == 99
          assert p['config']['seed'] == 1
          print('R1 synthetic receipt PASS')
          PY

      - name: Verify wheel and installed CLI
        run: |
          rm -rf dist build /tmp/brainloops-r1-install
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -m pip install --target /tmp/brainloops-r1-install dist/*.whl
          PYTHONPATH=/tmp/brainloops-r1-install python -m brainloops.cli --help | tee /tmp/help.txt
          grep -q 'r1-synthetic' /tmp/help.txt
          grep -q 'r1-lemon' /tmp/help.txt
          PYTHONPATH=/tmp/brainloops-r1-install python - <<'PY'
          import brainloops
          import brainloops.transition_recurrence
          import brainloops.datasets.lemon
          import experiments.r1_synthetic
          import experiments.r1_lemon
          print('clean-target imports OK')
          PY

      - name: Finalize verified branch tree
        run: |
          rm -rf dist build .r1
          git rm .github/workflows/r1-finalize.yml
          git add brainloops experiments tests README.md results docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement R1 resting transition recurrence'
          git push origin HEAD:feature/r1-resting-transition-recurrence
