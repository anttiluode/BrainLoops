name: Gate 1B branch verification

on:
  push:
    branches:
      - feature/gate1b-phase-alignment
    paths-ignore:
      - '.ci-output/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Run pytest and capture failure
        shell: bash
        run: |
          set +e
          pytest -q > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          if [ "$rc" -ne 0 ]; then
            mkdir -p .ci-output
            cp pytest-output.txt .ci-output/pytest.txt
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .ci-output/pytest.txt
            git commit -m "ci: capture pytest failure" || true
            git push
          fi
          exit "$rc"
